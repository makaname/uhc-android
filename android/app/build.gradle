plugins {
    id 'com.android.application'
}

// One permanent signing key for every build (local and CI), so updates always install over the
// previous version without wiping reading progress. The key lives outside the repo:
//   ~/.android/uhc-signing.properties  (or the file named by UHC_SIGNING_PROPERTIES)
// with storeFile, storePassword, keyAlias, keyPassword. Without it, builds fall back to the debug key.
def signingProps = new Properties()
def signingFile = file(System.getenv('UHC_SIGNING_PROPERTIES') ?: "${System.getProperty('user.home')}/.android/uhc-signing.properties")
if (signingFile.isFile()) signingFile.withInputStream { signingProps.load(it) }
def hasSigning = signingProps.getProperty('storeFile') != null

// Version comes from CI tags (v2.8.1-android.N -> versionCode N) or the defaults below.
def ciVersionName = System.getenv('UHC_VERSION_NAME')
def ciVersionCode = System.getenv('UHC_VERSION_CODE')

android {
    namespace 'uhc.android.reader'
    compileSdk 35

    defaultConfig {
        applicationId 'uhc.android.reader'
        minSdk 26
        targetSdk 35
        versionCode ciVersionCode ? ciVersionCode.toInteger() : 5
        versionName ciVersionName ?: '2.8.1-android.5'
    }

    signingConfigs {
        if (hasSigning) {
            uhc {
                storeFile file(signingProps.getProperty('storeFile'))
                storePassword signingProps.getProperty('storePassword')
                keyAlias signingProps.getProperty('keyAlias')
                keyPassword signingProps.getProperty('keyPassword')
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // build/assets/web is produced by tools/prepare-web.mjs (the UHC bundle + shim)
            assets.srcDirs = ['src/main/assets', '../../build/assets']
        }
    }

    buildTypes {
        debug {
            if (hasSigning) signingConfig signingConfigs.uhc
        }
        release {
            minifyEnabled false
            if (hasSigning) signingConfig signingConfigs.uhc
        }
    }
}

// Rebuild the web bundle before packaging assets, so the APK never ships a stale shim.
tasks.register('prepareWeb', Exec) {
    workingDir = file('../..')
    commandLine 'node', 'tools/prepare-web.mjs'
}
tasks.named('preBuild') { dependsOn 'prepareWeb' }
